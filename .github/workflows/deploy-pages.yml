name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build verified Pages artifact
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tools/qa/package-lock.json
      - name: Build dist
        run: python3 tools/build/build-site.py
      - name: Install locked QA dependencies
        run: npm ci --prefix tools/qa
      - name: Validate HTML
        run: npm exec --prefix tools/qa html-validate -- "dist/**/*.html"
      - name: Install Chromium for Playwright
        run: npm exec --prefix tools/qa playwright-core install --with-deps chromium
      - name: Validate deploy artifact
        env:
          PLAYWRIGHT_BROWSER: chromium
          SKIP_LIVE_VISUAL_COMPARE: "1"
        run: node tools/qa/qa-site.cjs
      - name: Scan current tree and Git history
        run: node tools/qa/security-scan.cjs
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist

  deploy:
    name: Deploy Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4