name: Production approval gate

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: read
  pull-requests: read

jobs:
  require-owner-approval:
    name: Owner approval gate
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Require owner approval for the current PR head
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const pr = context.payload.pull_request;
            if (!pr) {
              core.setFailed('No pull request context.');
              return;
            }
            const owner = 'irenkipo';
            const { data: reviews } = await github.rest.pulls.listReviews({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              per_page: 100
            });
            const latestByUser = new Map();
            for (const review of reviews) {
              if (review.user && review.commit_id) latestByUser.set(review.user.login, review);
            }
            const review = latestByUser.get(owner);
            if (!review) {
              core.setFailed(`Missing approval from ${owner}.`);
              return;
            }
            if (review.state !== 'APPROVED') {
              core.setFailed(`Latest review from ${owner} is ${review.state}, not APPROVED.`);
              return;
            }
            if (review.commit_id !== pr.head.sha) {
              core.setFailed('Owner approval is stale because the PR head changed after approval.');
              return;
            }
            core.info(`Fresh approval from ${owner} found for ${pr.head.sha}.`);