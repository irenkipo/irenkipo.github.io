name: Production approval gate

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, edited]
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: read
  pull-requests: read

jobs:
  require-owner-approval:
    name: Owner approval gate
    runs-on: ubuntu-latest
    steps:
      - name: Require explicit owner approval for the current PR head
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const pr = context.payload.pull_request;
            if (!pr) {
              core.setFailed('No pull request context.');
              return;
            }
            if (pr.draft) {
              core.info('Draft PR: production approval gate is not active yet.');
              return;
            }

            const owner = 'irenkipo';
            const expectedMarker = `APPROVE PRODUCTION ${pr.head.sha}`;

            const { data: reviews } = await github.rest.pulls.listReviews({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              per_page: 100
            });
            const latestByUser = new Map();
            for (const review of reviews) {
              if (review.user && review.commit_id) latestByUser.set(review.user.login, review);
            }
            const review = latestByUser.get(owner);
            if (review && review.state === 'APPROVED' && review.commit_id === pr.head.sha) {
              core.info(`Fresh GitHub review approval from ${owner} found for ${pr.head.sha}.`);
              return;
            }

            const bodyLines = String(pr.body || '')
              .split(/\r?\n/)
              .map(line => line.trim());
            if (pr.user && pr.user.login === owner && bodyLines.includes(expectedMarker)) {
              core.info(`Fresh explicit owner marker found for ${pr.head.sha}.`);
              return;
            }

            core.setFailed(
              `Missing fresh owner approval for ${pr.head.sha}. ` +
              `Use an APPROVED review, or for a self-authored PR add this exact line to the PR body: ${expectedMarker}`
            );
