name: Publish Book1 audiobook V11 release
on:
  push:
    branches: [main]
    paths: ['.github/workflows/audiobook-v2-release-ch11-test.yml']
permissions:
  contents: write
jobs:
  publish-v11:
    runs-on: [self-hosted, Windows, X64, promo]
    timeout-minutes: 60
    env:
      AUDIO_DIR: 'D:\\Common\\II\\Novel_Project\\NovelProjectV2\\Audiobook_V_zone_vidimosti\\output\\quality_v11\\web'
      TAG: 'audiobook-v-zone-vidimosti-v11-final'
      ZIP: 'Iren_Kipo_V_zone_vidimosti_Audiobook_V11_FINAL.zip'
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Verify and publish V11
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $files=1..11|%{Join-Path $env:AUDIO_DIR ("CH{0:D2}_WEB_V11_CANDIDATE.mp3" -f $_)}
          foreach($p in $files){if(!(Test-Path $p)){throw "Missing $p"}}
          $full=Join-Path $env:AUDIO_DIR 'BOOK1_FULL_V11_CANDIDATE.mp3'
          if(!(Test-Path $full)){throw "Missing full V11"}
          $hash=(Get-FileHash $full -Algorithm SHA256).Hash.ToLowerInvariant()
          if($hash -ne '7b74fefb0174061c6e474834bb65e10abfc247c20463260474a25aa679b4e62c'){throw "Bad V11 hash $hash"}
          $zip=Join-Path $env:AUDIO_DIR $env:ZIP
          if(Test-Path $zip){Remove-Item $zip -Force}
          Compress-Archive -LiteralPath $files -DestinationPath $zip -CompressionLevel Optimal
          gh release view $env:TAG *> $null
          if($LASTEXITCODE -ne 0){gh release create $env:TAG --title "В зоне видимости — аудиокнига V11" --notes "Approved Book 1 audiobook V11." --latest=false}
          foreach($p in $files){gh release upload $env:TAG $p --clobber}
          gh release upload $env:TAG $zip --clobber
          if($LASTEXITCODE -ne 0){throw "V11 release upload failed"}
          Write-Host "V11_RELEASE_UPLOAD=PASS"
