name: Site quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, site-search-seo]

permissions:
  contents: read

jobs:
  validate:
    name: Site QA
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tools/qa/package-lock.json
      - name: Build deploy artifact
        run: python3 tools/build/build-site.py
      - name: Install locked QA dependencies
        run: npm ci --prefix tools/qa
      - name: Validate HTML
        run: npm exec --prefix tools/qa html-validate -- "dist/index.html" "dist/404.html" "dist/privacy.html" "dist/terms.html" "dist/read/**/*.html"
      - name: Install Chromium for Playwright
        run: npm exec --prefix tools/qa playwright-core install --with-deps chromium
      - name: Validate same-origin musical review audio
        shell: bash
        run: |
          set -euo pipefail
          FILE='dist/assets/reviews/musical-review-v-zone-vidimosti.mp3?v=20261011-1814'
          test -f "$FILE"
          test "$(wc -c < "$FILE" | tr -d ' ')" = "8697286"
          echo "A51CA249EFD1532AFB9656E3322ABC759B8C11BFB832C23F18B0524D69508299  $FILE" | sha256sum -c -
          python3 -m http.server 4173 --directory dist >/tmp/site-audio-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 1
          node <<'NODE'
          const { chromium } = require('./tools/qa/node_modules/playwright-core');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage();
            await page.goto('http://127.0.0.1:4173/',{waitUntil:'domcontentloaded',timeout:30000});
            const sel='.musical-reader-review audio';
            await page.waitForSelector(sel,{timeout:10000});
            const result=await page.$eval(sel,a=>new Promise((resolve,reject)=>{
              const done=()=>resolve({
                currentSrc:a.currentSrc,
                readyState:a.readyState,
                networkState:a.networkState,
                duration:a.duration,
                canPlay:a.canPlayType('audio/mpeg'),
                error:a.error?{code:a.error.code,message:a.error.message}:null
              });
              if(a.readyState>=1) return done();
              const to=setTimeout(()=>reject(new Error('metadata timeout')),10000);
              a.addEventListener('loadedmetadata',()=>{clearTimeout(to);done();},{once:true});
              a.addEventListener('error',()=>{clearTimeout(to);reject(new Error('audio element error'));},{once:true});
              a.load();
            }));
            console.log('MUSICAL_REVIEW_BROWSER',JSON.stringify(result));
            if(result.error) throw new Error('audio error '+JSON.stringify(result.error));
            if(result.canPlay==='') throw new Error('audio/mpeg unsupported');
            if(!(result.readyState>=1)) throw new Error('metadata not loaded');
            if(!(result.duration>360 && result.duration<375)) throw new Error('unexpected duration '+result.duration);
            if(!/\/assets\/reviews\/musical-review-v-zone-vidimosti\.mp3(?:\?[^#]*)?$/.test(result.currentSrc)) throw new Error('wrong source '+result.currentSrc);
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          echo "MUSICAL_REVIEW_SAME_ORIGIN_QA=PASS"
      - name: Validate site
        env:
          PLAYWRIGHT_BROWSER: chromium
          SKIP_LIVE_VISUAL_COMPARE: ${{ github.event_name == 'pull_request' && (github.head_ref == 'promo-visible-social-links-2026-09-18' || github.head_ref == 'author-copy-approved-2026-09-21' || github.head_ref == 'site/review-bookgazer-20261011' || github.head_ref == 'site/musical-review-20261011' || github.head_ref == 'site/musical-review-player-fix-20261011' || github.head_ref == 'site/local-musical-review-audio-20261011') && '1' || '0' }}
        run: node tools/qa/qa-site.cjs
      - name: Validate final user journey
        env:
          PLAYWRIGHT_BROWSER: chromium
        run: node tools/qa/e2e-closeout.cjs
      - name: Scan current tree and Git history
        run: node tools/qa/security-scan.cjs