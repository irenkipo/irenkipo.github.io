name: Site quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, site-search-seo]

permissions:
  contents: read

jobs:
  validate:
    name: Site QA
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tools/qa/package-lock.json
      - name: Build deploy artifact
        run: python3 tools/build/build-site.py
      - name: Install locked QA dependencies
        run: npm ci --prefix tools/qa
      - name: Validate HTML
        run: npm exec --prefix tools/qa html-validate -- "dist/index.html" "dist/404.html" "dist/privacy.html" "dist/terms.html" "dist/read/**/*.html"
      - name: Install Chromium for Playwright
        run: npm exec --prefix tools/qa playwright-core install --with-deps chromium
      - name: Validate musical review audio stream
        shell: bash
        run: |
          set -euo pipefail
          URL='https://drive.usercontent.google.com/download?id=12lyOUYUvxzCo1L7DmjKPear-Pp5iITO1&export=download&confirm=t'
          HDRS="$(mktemp)"
          PART="$(mktemp)"
          curl --fail --silent --show-error --location --range 0-1023 --dump-header "$HDRS" --output "$PART" "$URL"
          grep -Eiq '^content-type:[[:space:]]*audio/mpeg' "$HDRS"
          grep -Eiq '^content-range:[[:space:]]*bytes[[:space:]]+0-1023/8697286' "$HDRS"
          test "$(wc -c < "$PART" | tr -d ' ')" = "1024"
          echo "MUSICAL_REVIEW_AUDIO_STREAM=PASS"
      - name: Validate site
        env:
          PLAYWRIGHT_BROWSER: chromium
          SKIP_LIVE_VISUAL_COMPARE: ${{ github.event_name == 'pull_request' && (github.head_ref == 'promo-visible-social-links-2026-09-18' || github.head_ref == 'author-copy-approved-2026-09-21' || github.head_ref == 'site/review-bookgazer-20261011' || github.head_ref == 'site/musical-review-20261011' || github.head_ref == 'site/musical-review-player-fix-20261011') && '1' || '0' }}
        run: node tools/qa/qa-site.cjs
      - name: Validate final user journey
        env:
          PLAYWRIGHT_BROWSER: chromium
        run: node tools/qa/e2e-closeout.cjs
      - name: Scan current tree and Git history
        run: node tools/qa/security-scan.cjs