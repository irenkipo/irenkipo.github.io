name: Free plan - website and audiobook availability

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/scripts/free_plan_site_health.py'
      - '.github/workflows/free-plan-site-health.yml'
  schedule:
    - cron: '41 12 * * *'

permissions:
  contents: read

concurrency:
  group: free-plan-site-health
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Validate read-only health check
        run: |
          python3 -m py_compile .github/scripts/free_plan_site_health.py
          python3 .github/scripts/free_plan_site_health.py --self-test
      - name: Verify live GitHub Pages, 11 MP3 release assets and ZIP
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/free_plan_site_health.py
