name: Create search SEO pull request

on:
  push:
    branches: [site-search-seo]

permissions:
  contents: read
  pull-requests: write

jobs:
  create-pr:
    name: Create search SEO PR
    runs-on: ubuntu-latest
    steps:
      - name: Create pull request if absent
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = 'site-search-seo';
            const { data: existing } = await github.rest.pulls.list({
              owner,
              repo,
              state: 'open',
              head: `${owner}:${branch}`,
              base: 'main'
            });
            if (existing.length) {
              core.info(`Search SEO PR already exists: ${existing[0].html_url}`);
              return;
            }
            const { data: pr } = await github.rest.pulls.create({
              owner,
              repo,
              head: branch,
              base: 'main',
              title: 'Complete technical search engine preparation',
              body: [
                'Technical Search/SEO candidate for owner review.',
                '',
                '- preserves the locked site with zero visible changes',
                '- adds the working semantic core and Google/Bing owner setup guide',
                '- adds weekly and path-triggered public production SEO health checks',
                '- keeps Google Search Console and Bing states honestly pending',
                '',
                'Do not merge until all required checks pass and the owner approves the current PR HEAD.'
              ].join('\n')
            });
            core.info(`Created ${pr.html_url}`);
