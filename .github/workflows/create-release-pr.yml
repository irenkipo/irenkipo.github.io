name: Create Google verification pull request

on:
  push:
    branches: [google-search-verification]

permissions:
  contents: read
  pull-requests: write

jobs:
  create-pr:
    name: Create Google verification PR
    runs-on: ubuntu-latest
    steps:
      - name: Create pull request if absent
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = 'google-search-verification';
            const { data: existing } = await github.rest.pulls.list({
              owner,
              repo,
              state: 'open',
              head: `${owner}:${branch}`,
              base: 'main'
            });
            if (existing.length) {
              core.info(`Google verification PR already exists: ${existing[0].html_url}`);
              return;
            }
            const { data: pr } = await github.rest.pulls.create({
              owner,
              repo,
              head: branch,
              base: 'main',
              title: 'Add Google Search Console verification file',
              body: [
                'Minimal verification-only candidate for owner review.',
                '',
                '- adds the exact Google Search Console HTML verification file provided by the owner',
                '- updates SITE CURRENT for this verification delta',
                '- preserves the locked site with no visible content or design changes',
                '',
                'Do not merge until all required checks pass and the owner approves the current PR HEAD.'
              ].join('\n')
            });
            core.info(`Created ${pr.html_url}`);
