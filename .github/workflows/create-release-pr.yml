name: Create subscription pull request

on:
  push:
    branches: [subscription-google-form]

permissions:
  contents: read
  pull-requests: write

jobs:
  create-pr:
    name: Create subscription PR
    runs-on: ubuntu-latest
    steps:
      - name: Create pull request if absent
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = 'subscription-google-form';
            const { data: existing } = await github.rest.pulls.list({
              owner,
              repo,
              state: 'open',
              head: `${owner}:${branch}`,
              base: 'main'
            });
            if (existing.length) {
              core.info(`Subscription PR already exists: ${existing[0].html_url}`);
              return;
            }
            const { data: pr } = await github.rest.pulls.create({
              owner,
              repo,
              head: branch,
              base: 'main',
              title: 'Connect the approved Google Form subscription CTA',
              body: [
                'Minimal subscription-only candidate for owner review.',
                '',
                '- replaces the disabled local e-mail form with the approved public Google Form CTA',
                '- removes obsolete subscription provider config and client-side submit logic',
                '- preserves the locked site outside the approved subscription delta',
                '',
                'Do not merge until all required checks pass and the owner approves the current PR HEAD.'
              ].join('\n')
            });
            core.info(`Created ${pr.html_url}`);