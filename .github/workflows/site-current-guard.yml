name: SITE CURRENT guard

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  current-sync:
    name: SITE CURRENT guard
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Require CURRENT for production or build changes
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
            if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
              echo "Initial branch push; no prior commit to compare."
              exit 0
            fi
          fi

          mapfile -t CHANGED < <(git diff --name-only "$BASE" "$HEAD")
          printf 'Changed files:\n%s\n' "${CHANGED[*]}"
          SITE_CHANGED=false
          CURRENT_CHANGED=false
          for file in "${CHANGED[@]}"; do
            case "$file" in
              project-control/CURRENT.md)
                CURRENT_CHANGED=true
                ;;
              README.md|project-control/DEPENDENCIES.md|project-control/QA_PROTOCOL.md)
                ;;
              *)
                SITE_CHANGED=true
                ;;
            esac
          done

          if [ "$SITE_CHANGED" = false ]; then
            echo "Only explicitly safe documentation changed."
            exit 0
          fi
          if [ "$CURRENT_CHANGED" = true ]; then
            echo "CURRENT updated with production/build-affecting changes."
            exit 0
          fi
          echo "ERROR: production/build-affecting changes require project-control/CURRENT.md."
          exit 1