name: SEO health

on:
  workflow_dispatch:
  schedule:
    - cron: '17 8 * * 1' # Monday 08:17 UTC
  workflow_run:
    workflows: ['Deploy GitHub Pages']
    types: [completed]
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - 'src/site/**'
      - 'src/read/**'
      - 'src/legal/**'
      - 'src/assets/brand/**'
      - 'src/assets/approved/social-share.png'
      - 'src/assets/js/site.js'
      - 'src/assets/css/**'
      - 'tools/build/build-site.py'
      - 'tools/qa/seo-health.cjs'
      - '.github/workflows/seo-health.yml'
      - '.github/workflows/deploy-pages.yml'
  push:
    branches: [main, site-search-seo]
    paths:
      - 'src/site/**'
      - 'src/read/**'
      - 'src/legal/**'
      - 'src/assets/brand/**'
      - 'src/assets/approved/social-share.png'
      - 'src/assets/js/site.js'
      - 'src/assets/css/**'
      - 'tools/build/build-site.py'
      - 'tools/qa/seo-health.cjs'
      - '.github/workflows/seo-health.yml'
      - '.github/workflows/deploy-pages.yml'

permissions:
  contents: read

jobs:
  production-health:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    name: Production SEO health
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Check public production SEO
        env:
          SEO_BASE_URL: https://irenkipo.github.io/
        run: node tools/qa/seo-health.cjs